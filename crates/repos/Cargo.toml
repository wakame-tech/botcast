[package]
name = "repos"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
tokio = { version = "1.39.3", features = [
    "macros",
    "process",
    "rt-multi-thread",
] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
async-trait = "0.1.83"
thiserror = "1.0.64"
rust-s3 = "0.35.1"

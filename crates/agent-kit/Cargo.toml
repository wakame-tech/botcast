[package]
name = "agent-kit"
version = "0.1.0"
edition = "2021"
description = "LLM エージェントの worker の共通部分（定期実行・エージェントのループ・MCP・Web の取得・トレース）"

[features]
# アプリのテストで使う部品（span をメモリに貯める subscriber・フェイクの取得）
testing = []

[dependencies]
readable_text = { path = "../readable_text" }
anyhow = "1.0.86"
async-trait = "0.1.83"
chrono = "0.4.38"
futures = "0.3.31"
kafru = "1.0.4"
reqwest = { version = "0.12.7", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1.6.0", features = ["client", "transport-child-process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39.3", features = ["macros", "process", "rt-multi-thread", "net", "time"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["json", "env-filter"] }
opentelemetry = { version = "0.27.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.27.0", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27.0", features = ["trace"] }
tracing-opentelemetry = "0.28.0"
url = "2"

[dev-dependencies]
axum = "0.7.5"

[package]
name = "audio_generator"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing = "0.1.37"
anyhow = "1.0.89"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
reqwest = { version = "0.12.7", default-features = false, features = ["json", "multipart", "rustls-tls"] }
urlencoding = "2.1.3"
async-trait = "0.1.83"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
tokio = { version = "1.39.3", features = [
    "fs",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
futures = "0.3.31"
sha2 = "0.10.8"
hex = "0.4.3"
wavers = "1.4.3"
srtlib = "0.2.0"

[dev-dependencies]
axum = "0.7.5"
tokio = { version = "1.39.3", features = ["net", "time"] }

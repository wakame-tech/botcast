services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: botcast-surrealdb-dev
    ports:
      - "4030:8000"
    command: start --user kafru_admin --pass kafru_password memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dify-sandbox:
    image: langgenius/dify-sandbox
    container_name: botcast-dify-sandbox-dev
    ports:
      - "8194:8194"
    environment:
      API_KEY: dify-sandbox

  # トレース: worker の OTLP_COLLECTOR_ENDPOINT=http://localhost:4317 → collector → jaeger（http://localhost:16686）
  # 設定はセルフホストと同じものを使う
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: botcast-otel-collector-dev
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./deploy/selfhost/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: botcast-jaeger-dev
    user: root
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./deploy/selfhost/jaeger-config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger_data:/badger
    ports:
      - "16686:16686"


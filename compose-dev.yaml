services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: botcast-surrealdb-dev
    ports:
      - "4030:8000"
    command: start --user kafru_admin --pass kafru_password memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dify-sandbox:
    image: langgenius/dify-sandbox
    container_name: botcast-dify-sandbox-dev
    ports:
      - "8194:8194"
    environment:
      API_KEY: dify-sandbox


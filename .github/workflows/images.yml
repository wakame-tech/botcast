name: Publish container images

# セルフホスト用の worker / web イメージを GHCR に push する。
# デプロイ先は `docker compose pull && docker compose up -d` するだけでよい (deploy/selfhost/compose.yaml)。
on:
  push:
    branches: [main]
  # PR ではビルドだけ確認する (push は main のみ)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [worker, web]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PR でもログインする: worker は private な botcast-cms-mcp を pull する
      # (パッケージ設定の Manage Actions access でこのリポジトリに読み取りを許可している)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/botcast-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/selfhost/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # web は CMS の URL とテナントをビルド時に埋め込む (リポジトリ変数 CMS_URL / CMS_TENANT)
          # worker は botcast-cms-mcp イメージから MCP サーバーを取り込む
          build-args: |
            VITE_CMS_URL=${{ vars.CMS_URL || 'https://cms.w4k4.me' }}
            VITE_CMS_TENANT=${{ vars.CMS_TENANT || 'botcast' }}
            VITE_WORKER_URL=/api
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

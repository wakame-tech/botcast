[workspace]
members = [
    "crates/api",
    "crates/openapi-gen",
    "crates/worker",
    "crates/audio_generator",
    "crates/readable_text",
    "crates/repos",
    "crates/migration",
    "crates/botcast-api",
    "crates/botcast-openapi-gen",
    "crates/botcast-openapi-client",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.86"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39.3", features = ["full"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["json", "env-filter"] }
async-trait = "0.1"
thiserror = "1.0.64"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8" }

[package]
name = "api"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = { version = "0.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
surrealdb = "2.3.7"
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.17"
async-trait = "0.1"
dotenvy = "0.15"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
axum-extra = { version = "0.10", features = ["cookie"] }
http = "1.0"
tracing = "0.1"
validator = { version = "0.20", features = ["derive"] }
openapi = { path = "../openapi-gen", features = ["server"] }
worker = { path = "../worker" }
reqwest = { version = "0.12.22", features = ["json"]}
async-openai = "0.29.1"
base64 = "0.22.1"

[dev-dependencies]
tempfile = "3.27.0"

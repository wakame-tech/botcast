server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # web の worker クライアント (VITE_WORKER_URL=/api) 用に worker を同一オリジンで中継する
    location /api/ {
        proxy_pass http://worker:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# セルフホスト構成 (docker compose 1 台構成)
# - CMS は外部 (CMS_URL) を使う
# - 音声・字幕ファイルは CMS に保存する
# - VOICEVOX は起動しない (VOICEVOX_ENDPOINT を設定すれば外部のものを使える)
# - worker / web は GHCR のイメージ (.github/workflows/images.yml) を使う:
#     docker compose pull && docker compose up -d --remove-orphans
#   手元でビルドするときは docker compose up -d --build
# - watchtower が GHCR の新しいイメージを 5 分ごとに確認し、ラベル付きのコンテナを入れ替える
#   (botcast-cms の deploy/compose.yaml の api / web も対象)。compose ファイルの変更は手動で反映する
name: botcast

services:
  worker:
    image: ghcr.io/wakame-tech/botcast-worker:${BOTCAST_TAG:-latest}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile.worker
      args:
        CMS_MCP_IMAGE: ${CMS_MCP_IMAGE:-ghcr.io/wakame-tech/botcast-cms-mcp:latest}
    restart: unless-stopped
    env_file:
      - path: ./worker.env
        required: false
    ports:
      - "9001:9001"
    environment:
      - PORT=9001
      - CMS_URL=${CMS_URL}
      - API_KEY=${API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # ANTHROPIC_MODEL / VOICEVOX_ENDPOINT は空文字だとそのまま使われるため
      # 必要なときだけ env_file (worker.env) 経由で渡す
      - OTLP_COLLECTOR_ENDPOINT=http://otel-collector:4317
      - KAFRU_DB_HOST=kafru-db
      - KAFRU_DB_PORT=8000
      - KAFRU_DB_USERNAME=${KAFRU_DB_USERNAME:-kafru_admin}
      - KAFRU_DB_PASSWORD=${KAFRU_DB_PASSWORD}
      - KAFRU_DB_NAMESPACE=botcast
      - KAFRU_DB_NAME=kafru
    depends_on:
      kafru-db:
        condition: service_healthy
      otel-collector:
        condition: service_started

  kafru-db:
    image: surrealdb/surrealdb:v2
    restart: unless-stopped
    user: root
    command: start --user ${KAFRU_DB_USERNAME:-kafru_admin} --pass ${KAFRU_DB_PASSWORD} rocksdb:/data/kafru.db
    volumes:
      - kafru_data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  web:
    # CMS_URL はビルド時に埋め込まれる。GHCR のイメージはリポジトリ変数 CMS_URL の値
    image: ghcr.io/wakame-tech/botcast-web:${BOTCAST_TAG:-latest}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile.web
      args:
        VITE_CMS_URL: ${CMS_URL}
        VITE_WORKER_URL: ${WEB_WORKER_URL:-/api}
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - worker

  # GHCR の新しいイメージを pull して、ラベル付きのコンテナを再作成する
  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # private な GHCR を pull するための docker login の認証情報
      - ${DOCKER_CONFIG_FILE:-~/.docker/config.json}:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      # 任意: 更新時の通知先 (shoutrrr 形式。例: discord://<token>@<webhook id>)。.env に書く
      - WATCHTOWER_NOTIFICATION_URL

volumes:
  kafru_data:
